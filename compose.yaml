name: ustp-portal
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ustp
      POSTGRES_USER: ustp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustp -d ustp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # PostgreSQL is reachable only by containers in this Compose project.
  app:
    image: ustp-portal:local
    platform: linux/amd64
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ustp
      PGDATABASE: ustp
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      EMAIL_SETTINGS_KEY: ${EMAIL_SETTINGS_KEY:?Set a permanent 64-hex EMAIL_SETTINGS_KEY in .env.docker}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - recovery:/var/lib/ustp/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  database:
  recovery:
