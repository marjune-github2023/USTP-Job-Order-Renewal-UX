name: ustp-portal
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ustp
      POSTGRES_USER: ustp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ustp -d ustp"]
      interval: 5s
      timeout: 5s
      retries: 10
    # PostgreSQL is reachable only by containers in this Compose project.
  app:
    image: ustp-portal:local
    platform: linux/amd64
    build: .
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ustp
      PGDATABASE: ustp
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      PORT: "8080"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      EMAIL_SETTINGS_KEY: ${EMAIL_SETTINGS_KEY:?Set a permanent 64-hex EMAIL_SETTINGS_KEY in .env.docker}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://ustp:${POSTGRES_PASSWORD}@db:5432/ustp}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      USTP_ADMIN_EMAIL: ${USTP_ADMIN_EMAIL:-ict.claveria@ustp.edu.ph}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
    volumes:
      - recovery:/var/lib/ustp/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # Quick Tunnel (random *.trycloudflare.com URL, no account/domain needed).
    # For a permanent Named Tunnel with your own domain: set TUNNEL_TOKEN in .env.docker
    # and change command to: tunnel --no-autoupdate run
    command: tunnel --no-autoupdate --url http://app:8080
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      app:
        condition: service_healthy
volumes:
  database:
  recovery:
